buildscript {
    def kotlinVersion = rootProject.ext.has('kotlinVersion')
        ? rootProject.ext.get('kotlinVersion')
        : project.properties['RNDeviceFingerprint_kotlinVersion']

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def getExtOrIntegerDefault(name) {
    return rootProject.ext.has(name)
        ? rootProject.ext.get(name)
        : project.properties["RNDeviceFingerprint_${name}"].toInteger()
}

android {
    namespace 'com.fingerprintreactnative'
    compileSdkVersion getExtOrIntegerDefault('compileSdkVersion')

    defaultConfig {
        minSdkVersion getExtOrIntegerDefault('minSdkVersion')
        targetSdkVersion getExtOrIntegerDefault('targetSdkVersion')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

repositories {
    google()
    mavenCentral()
    maven {
        url 'https://jitpack.io'
        content { includeGroup 'com.github.fingerprintjs' }
    }
}

dependencies {
    implementation 'com.facebook.react:react-native:+'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib'
    implementation 'com.github.fingerprintjs:fingerprint-android:2.2.0'
}
